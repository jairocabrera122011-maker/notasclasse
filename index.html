<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalculaNotas</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4f7;
            color: #222;
            padding: 30px 15px;
        }

        .contenedor {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .tarjeta {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .asignatura {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 10px;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        .calcular {
            background: #222;
            color: white;
        }

        .añadir {
            background: #e9ecef;
            color: #222;
        }

        .resultado {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
        }

        .aprobado {
            color: green;
        }

        .suspendido {
            color: red;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>📚 CalculaNotas</h1>

    <p class="descripcion">
        Calcula fácilmente tu nota media de clase.
    </p>

    <div class="tarjeta">

        <div id="asignaturas">

            <div class="asignatura">
                <input type="text" placeholder="Asignatura">
                <input type="number" placeholder="Nota" min="0" max="10" step="0.1">
            </div>

            <div class="asignatura">
                <input type="text" placeholder="Asignatura">
                <input type="number" placeholder="Nota" min="0" max="10" step="0.1">
            </div>

            <div class="asignatura">
                <input type="text" placeholder="Asignatura">
                <input type="number" placeholder="Nota" min="0" max="10" step="0.1">
            </div>

        </div>

        <button class="añadir" onclick="añadirAsignatura()">
            + Añadir asignatura
        </button>

        <button class="calcular" onclick="calcularMedia()">
            Calcular media
        </button>

        <div id="resultado" class="resultado"></div>

    </div>

</div>

<script>

function añadirAsignatura() {

    const contenedor = document.getElementById("asignaturas");

    const nueva = document.createElement("div");

    nueva.className = "asignatura";

    nueva.innerHTML = `
        <input type="text" placeholder="Asignatura">
        <input type="number" placeholder="Nota" min="0" max="10" step="0.1">
    `;

    contenedor.appendChild(nueva);
}


function calcularMedia() {

    const notas = document.querySelectorAll(
        '#asignaturas input[type="number"]'
    );

    let suma = 0;
    let cantidad = 0;

    notas.forEach(function(nota) {

        if (nota.value !== "") {

            let numero = parseFloat(nota.value);

            if (numero >= 0 && numero <= 10) {
                suma += numero;
                cantidad++;
            }
        }
    });

    const resultado = document.getElementById("resultado");

    if (cantidad === 0) {

        resultado.textContent = "Introduce alguna nota.";
        resultado.className = "resultado";

        return;
    }

    const media = suma / cantidad;

    if (media >= 5) {

        resultado.textContent =
            "Media: " + media.toFixed(2) + " — ¡Aprobado! ✅";

        resultado.className = "resultado aprobado";

    } else {

        resultado.textContent =
            "Media: " + media.toFixed(2) + " — Suspendido ❌";

        resultado.className = "resultado suspendido";
    }
}

</script>

</body>
</html>
